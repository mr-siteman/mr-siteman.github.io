server {
    listen 80;
    server_name classic-os.pages.dev;
    root /;

    if ($request_uri ~ ^(.*/)index$) {
        return 301 $1$is_args$args;
    }

    if ($request_uri ~ ^/(.*/)index\.html?) {
        return 301 /$1$is_args$args;
    }

    if ($request_uri ~ ^/(.*)\.html?) {
        return 302 /$1$is_args$args;
    }
}